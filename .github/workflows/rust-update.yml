name: Rust Update → Discord

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TESTE O VISUAL: republicar o patch atual sem alterar last_patch.json"
        required: true
        default: true
        type: boolean

concurrency:
  group: rust-discord-updater
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      ARGOS_CHUNK_TYPE: MINISBD
      TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run updater
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "TEST_MODE=${TEST_MODE}"
          python src/main.py

      - name: Persist state
        if: ${{ env.TEST_MODE != 'true' }}
        run: |
          git config user.name "rust-discord-updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_patch.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore: update published patch state"
            git push
          fi
